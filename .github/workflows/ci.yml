name: Godot QA and Android APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  listing-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate original marketing assets
        run: |
          python -m pip install Pillow==11.3.0
          python tools/generate_store_assets.py
          python - <<'PY'
          from PIL import Image
          specs = [
              ('build/store/play-icon-512.png',(512,512)),
              ('build/store/feature-graphic-1024x500.png',(1024,500))
          ]
          for path,size in specs:
              with Image.open(path) as im:
                  assert im.size==size and im.mode=='RGB', (path,im.size,im.mode)
          print("PASS: store icon and feature graphic sizes/formats")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: JumpyFrog-GooglePlay-Store-Art
          path: build/store/*.png
          if-no-files-found: error
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Install Android 35 toolchain
        run: |
          sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Install Godot 4.5.1 and export templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.5.1
          use-dotnet: false
          include-templates: true
      - name: Configure Android editor settings
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-$HOME/.android/sdk}}"
          JAVA="$(dirname "$(dirname "$(readlink -f "$(command -v javac)")")")"
          echo "JAVA_SDK_PATH=$JAVA"
          echo "ANDROID_SDK_PATH=$SDK"
          test -d "$SDK/platforms/android-35"
          test -d "$SDK/build-tools/35.0.0"
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.5.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/java_sdk_path = "$JAVA"
          export/android/android_sdk_path = "$SDK"
          EOF
      - name: Reject invalid source control characters
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for ext in ('*.gd', '*.gdshader', '*.tscn', '*.cfg'):
              for source in Path('.').rglob(ext):
                  if '.godot' in source.parts or 'build' in source.parts:
                      continue
                  data = source.read_bytes()
                  try:
                      data.decode('utf-8')
                  except UnicodeDecodeError as exc:
                      raise AssertionError(f'Invalid UTF-8: {source}') from exc
                  illegal = [i for i, byte in enumerate(data) if byte < 32 and byte not in (9, 10, 13)]
                  if illegal:
                      raise AssertionError(f'Illegal source control byte in {source} at byte {illegal[0]}')
          print('PASS: valid UTF-8 and no illegal source control bytes')
          PY
      - name: Import and validate Godot project
        run: |
          set -euo pipefail
          godot --headless --editor --path . --quit 2>&1 | tee /tmp/godot-import.log
          if grep -E 'SCRIPT ERROR:|Parse Error:|Failed to load script' /tmp/godot-import.log; then
            echo "::error::Godot script parsing failed during import"
            exit 1
          fi
      - name: Gameplay regression tests (bounded)
        run: |
          set -euo pipefail
          # Exit code alone is insufficient: catch regressions that leak audio
          # resources while still reporting a successful gameplay smoke test.
          timeout --signal=TERM --kill-after=10s 100s godot --verbose --headless --path . --script res://tests/smoke.gd 2>&1 | tee /tmp/jumpy-smoke.log
          if grep -E 'ObjectDB instances leaked|Leaked instance:' /tmp/jumpy-smoke.log; then
            echo "::error::Godot emitted a leaked-object warning during smoke test"
            exit 1
          fi
          timeout --signal=TERM --kill-after=10s 100s godot --headless --path . --script res://tests/chapters.gd
          timeout --signal=TERM --kill-after=10s 100s godot --headless --path . --script res://tests/retention_and_ads.gd
          # Running twice ensures an already-claimed daily save does not break QA.
          for attempt in 1 2; do
            timeout --signal=TERM --kill-after=10s 100s godot --headless --path . --script res://tests/daily_river.gd
          done
          timeout --signal=TERM --kill-after=10s 100s godot --headless --path . --script res://tests/endurance.gd
          timeout --signal=TERM --kill-after=10s 100s godot --headless --path . --script res://tests/lifecycle.gd
          timeout --signal=TERM --kill-after=10s 100s godot --headless --path . --script res://tests/render_quality.gd
          timeout --signal=TERM --kill-after=10s 100s godot --headless --path . --script res://tests/touch_and_fairness.gd
          timeout --signal=TERM --kill-after=10s 100s godot --headless --path . --script res://tests/guardian_flow.gd
          timeout --signal=TERM --kill-after=10s 100s godot --headless --path . --script res://tests/flow_rush.gd
          timeout --signal=TERM --kill-after=10s 100s godot --headless --path . --script res://tests/fragile_lilies.gd
          timeout --signal=TERM --kill-after=10s 100s godot --headless --path . --script res://tests/moving_lilies.gd
          timeout --signal=TERM --kill-after=10s 100s godot --headless --path . --script res://tests/visual_polish.gd
          timeout --signal=TERM --kill-after=10s 100s godot --headless --path . --script res://tests/harmony_lilies.gd
          timeout --signal=TERM --kill-after=10s 100s godot --headless --path . --script res://tests/weekly_expedition.gd
          timeout --signal=TERM --kill-after=10s 100s godot --headless --path . --script res://tests/run_report.gd
          timeout --signal=TERM --kill-after=10s 100s godot --headless --path . --script res://tests/save_store.gd
          timeout --signal=TERM --kill-after=10s 100s godot --headless --path . --script res://tests/device_diagnostics.gd
          timeout --signal=TERM --kill-after=10s 100s godot --headless --path . --script res://tests/layout_and_danger.gd
          timeout --signal=TERM --kill-after=10s 100s godot --headless --path . --script res://tests/gold_routes.gd
          timeout --signal=TERM --kill-after=10s 100s godot --headless --path . --script res://tests/river_festival.gd
          timeout --signal=TERM --kill-after=10s 100s godot --headless --path . --script res://tests/route_pacing.gd
          timeout --signal=TERM --kill-after=10s 100s godot --headless --path . --script res://tests/endless_pacing.gd
          timeout --signal=TERM --kill-after=10s 100s godot --headless --path . --script res://tests/jump_feedback.gd
          timeout --signal=TERM --kill-after=10s 100s godot --headless --path . --script res://tests/expressive_visuals.gd
          timeout --signal=TERM --kill-after=10s 100s godot --headless --path . --script res://tests/precision_sprint.gd
          timeout --signal=TERM --kill-after=10s 100s godot --headless --path . --script res://tests/rotating_challenges.gd
          timeout --signal=TERM --kill-after=10s 100s godot --headless --path . --script res://tests/challenge_streak.gd
          timeout --signal=TERM --kill-after=10s 100s godot --headless --path . --script res://tests/challenge_balance.gd
          timeout --signal=TERM --kill-after=10s 100s godot --headless --path . --script res://tests/challenge_mastery.gd
      - name: Create ephemeral debug signing key
        run: |
          keytool -genkeypair -noprompt -keystore "$RUNNER_TEMP/jumpy-debug.jks" \
            -alias androiddebugkey -storepass android -keypass android \
            -dname "CN=Android Debug,O=Android,C=US" -validity 10000 -keyalg RSA -keysize 2048
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$RUNNER_TEMP/jumpy-debug.jks" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android" >> "$GITHUB_ENV"
      - name: Generate original Android launcher icons
        run: godot --headless --path . --script res://tools/generate_icons.gd
      - name: Export Android debug APK
        run: |
          mkdir -p build
          godot --headless --path . --export-debug "Android" build/JumpyFrog-debug.apk
          test -s build/JumpyFrog-debug.apk
      - name: Validate generated Android package
        run: |
          set -e
          unzip -tq build/JumpyFrog-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose build/JumpyFrog-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging build/JumpyFrog-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump permissions build/JumpyFrog-debug.apk | grep -F "android.permission.VIBRATE"
          sha256sum build/JumpyFrog-debug.apk
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: JumpyFrog-Android-debug
          path: build/JumpyFrog-debug.apk
          if-no-files-found: error
