name: Godot QA and Android APK
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.5.1
    steps:
      - uses: actions/checkout@v4
      - name: Prepare Godot Android environment
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/share/godot/export_templates/4.5.1.stable"
          for base in /root/.local/share/godot/export_templates /opt/godot/export_templates /usr/local/share/godot/export_templates; do
            if [ -f "$base/4.5.1.stable/android_debug.apk" ]; then
              cp "$base/4.5.1.stable/"android_{debug,release}.apk "$HOME/.local/share/godot/export_templates/4.5.1.stable/" || true
            fi
          done
          if [ ! -f "$HOME/.local/share/godot/export_templates/4.5.1.stable/android_debug.apk" ]; then
            curl --fail -L --retry 3 -o /tmp/templates.tpz "https://github.com/godotengine/godot/releases/download/4.5.1-stable/Godot_v4.5.1-stable_export_templates.tpz"
            python3 - <<'PY'
          import zipfile,os,shutil
          root=os.path.expanduser('~/.local/share/godot/export_templates/4.5.1.stable')
          with zipfile.ZipFile('/tmp/templates.tpz') as z:
              for name in ['android_debug.apk','android_release.apk']:
                  with z.open('templates/'+name) as source,open(os.path.join(root,name),'wb') as dest:
                      shutil.copyfileobj(source,dest)
          PY
          fi
          JAVA_BIN="$(command -v javac || true)"
          if [ -z "$JAVA_BIN" ]; then
            apt-get update -qq && DEBIAN_FRONTEND=noninteractive apt-get install -y openjdk-17-jdk-headless
            JAVA_BIN="$(command -v javac)"
          fi
          echo "JAVA_SDK_PATH=$(dirname "$(dirname "$(readlink -f "$JAVA_BIN")")")" >> "$GITHUB_ENV"
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/opt/android-sdk}}"
          echo "ANDROID_SDK_PATH=$SDK" >> "$GITHUB_ENV"
          test -d "$SDK" || { echo "Android SDK missing: $SDK"; exit 1; }
      - name: Configure Godot Android SDK paths
        shell: bash
        run: |
          mkdir -p "$HOME/.config/godot"
          SETTINGS="$HOME/.config/godot/editor_settings-4.5.tres"
          cat > "$SETTINGS" <<EOF
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/java_sdk_path = "$JAVA_SDK_PATH"
          export/android/android_sdk_path = "$ANDROID_SDK_PATH"
          EOF
      - name: Import and validate Godot project
        run: godot --headless --editor --path . --quit
      - name: Gameplay smoke tests
        run: godot --headless --path . --script res://tests/smoke.gd
      - name: Export Android debug APK
        run: |
          mkdir -p build
          godot --headless --path . --export-debug "Android" build/JumpyFrog-debug.apk
          test -s build/JumpyFrog-debug.apk
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: JumpyFrog-Android-debug
          path: build/JumpyFrog-debug.apk
          if-no-files-found: error
