name: Godot QA and Android APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Install Android 35 toolchain
        run: |
          sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Install Godot 4.5.1 and export templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.5.1
          use-dotnet: false
          include-templates: true
      - name: Configure Android editor settings
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-$HOME/.android/sdk}}"
          JAVA="$(dirname "$(dirname "$(readlink -f "$(command -v javac)")")")"
          echo "JAVA_SDK_PATH=$JAVA"
          echo "ANDROID_SDK_PATH=$SDK"
          test -d "$SDK/platforms/android-35"
          test -d "$SDK/build-tools/35.0.0"
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.5.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/java_sdk_path = "$JAVA"
          export/android/android_sdk_path = "$SDK"
          EOF
      - name: Import and validate Godot project
        run: godot --headless --editor --path . --quit
      - name: Gameplay regression tests (bounded)
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=10s 100s godot --headless --path . --script res://tests/smoke.gd
      - name: Create ephemeral debug signing key
        run: |
          keytool -genkeypair -noprompt -keystore "$RUNNER_TEMP/jumpy-debug.jks" \
            -alias androiddebugkey -storepass android -keypass android \
            -dname "CN=Android Debug,O=Android,C=US" -validity 10000 -keyalg RSA -keysize 2048
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$RUNNER_TEMP/jumpy-debug.jks" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android" >> "$GITHUB_ENV"
      - name: Generate original Android launcher icons
        run: godot --headless --path . --script res://tools/generate_icons.gd
      - name: Export Android debug APK
        run: |
          mkdir -p build
          godot --headless --path . --export-debug "Android" build/JumpyFrog-debug.apk
          test -s build/JumpyFrog-debug.apk
      - name: Validate generated Android package
        run: |
          set -e
          unzip -tq build/JumpyFrog-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose build/JumpyFrog-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging build/JumpyFrog-debug.apk
          sha256sum build/JumpyFrog-debug.apk
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: JumpyFrog-Android-debug
          path: build/JumpyFrog-debug.apk
          if-no-files-found: error
