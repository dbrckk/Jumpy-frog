name: Monetized Android SDK QA

on:
  workflow_dispatch:
  push:
    paths:
      - scripts/monetization.gd
      - scripts/game.gd
      - scripts/chapters.gd
      - scripts/audio.gd
      - tests/smoke.gd
      - tests/chapters.gd
      - export_presets.cfg
      - scripts/daily.gd
      - scripts/art.gd
      - scripts/endless_pacing.gd
      - scripts/precision_sprint.gd
      - tests/precision_sprint.gd
      - tests/rotating_challenges.gd
      - tests/challenge_balance.gd
      - tests/challenge_mastery.gd
      - tests/endless_pacing.gd
      - monetization/**
      - tools/prepare_monetized_build.py
      - tests/retention_and_ads.gd
      - tests/daily_river.gd
      - tests/endurance.gd
      - tests/lifecycle.gd
      - tests/render_quality.gd
      - tests/touch_and_fairness.gd
      - .github/workflows/monetization-qa.yml

permissions:
  contents: read

jobs:
  monetized-debug-aab:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # Cache resolved native Android dependencies between builds to reduce
      # Maven Central request bursts (the previous CI export hit HTTP 429).
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Install Android API 36
        run: sdkmanager --install "platforms;android-36" "platforms;android-35" "build-tools;36.0.0" "build-tools;35.0.0"
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.5.1
          use-dotnet: false
          include-templates: true
      - name: Configure local Godot SDK paths
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-$HOME/.android/sdk}}"
          JAVA="$(dirname "$(dirname "$(readlink -f "$(command -v javac)")")")"
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.5.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/java_sdk_path = "$JAVA"
          export/android/android_sdk_path = "$SDK"
          EOF
      - name: Install verified plugins with Google's official SAMPLE AdMob IDs
        env:
          ADMOB_APP_ID: ca-app-pub-3940256099942544~3347511713
          ADMOB_INTERSTITIAL_UNIT_ID: ca-app-pub-3940256099942544/1033173712
          ADMOB_REWARDED_UNIT_ID: ca-app-pub-3940256099942544/5224354917
        run: python3 tools/prepare_monetized_build.py
      - name: Import and test all functionality
        run: |
          set -euo pipefail
          godot --headless --editor --path . --quit 2>&1 | tee /tmp/import.log
          if grep -E 'SCRIPT ERROR:|Parse Error:|Failed to load script' /tmp/import.log; then exit 1; fi
          timeout 120s godot --headless --path . --script res://tests/smoke.gd
          timeout 120s godot --headless --path . --script res://tests/retention_and_ads.gd
          timeout 120s godot --headless --path . --script res://tests/daily_river.gd
          timeout 120s godot --headless --path . --script res://tests/endurance.gd
          timeout 120s godot --headless --path . --script res://tests/lifecycle.gd
          timeout 120s godot --headless --path . --script res://tests/render_quality.gd
          timeout 120s godot --headless --path . --script res://tests/touch_and_fairness.gd
          timeout 120s godot --headless --path . --script res://tests/precision_sprint.gd
          timeout 120s godot --headless --path . --script res://tests/rotating_challenges.gd
          timeout 120s godot --headless --path . --script res://tests/challenge_streak.gd
          timeout 120s godot --headless --path . --script res://tests/challenge_balance.gd
          timeout 120s godot --headless --path . --script res://tests/challenge_mastery.gd
          timeout 120s godot --headless --path . --script res://tests/chapters.gd
          timeout 120s godot --headless --path . --script res://tests/endless_pacing.gd
      - name: Create ephemeral DEBUG signing identity
        run: |
          keytool -genkeypair -noprompt -keystore "$RUNNER_TEMP/jumpy-debug.jks" -alias androiddebugkey -storepass android -keypass android -dname "CN=Android Debug,O=Android,C=US" -validity 3650 -keyalg RSA -keysize 2048
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$RUNNER_TEMP/jumpy-debug.jks" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android" >> "$GITHUB_ENV"
      - name: Generate icons and export full native SDK test AAB
        run: |
          set -euo pipefail
          mkdir -p build
          godot --headless --path . --script res://tools/generate_icons.gd
          # Maven repositories occasionally throttle anonymous GitHub
          # runners (HTTP 429). Reuse Gradle's cached modules and retry
          # only this disposable QA export; never suppress a third failure.
          attempt=1
          until timeout --kill-after=15s 600s godot --headless --path . --install-android-build-template --export-debug "Google Play AAB" build/JumpyFrog-Monetized-QA.aab; do
            if (( attempt >= 3 )); then
              echo "::error::Native SDK QA AAB export failed after three attempts"
              exit 1
            fi
            echo "::warning::Native dependency or export error; retrying with cached Gradle modules"
            sleep "$((25 * attempt))"
            attempt=$((attempt + 1))
          done
          test -s build/JumpyFrog-Monetized-QA.aab
          unzip -tq build/JumpyFrog-Monetized-QA.aab
      - name: Validate bundle, Billing SDK and AdMob native package
        run: |
          set -euo pipefail
          curl -fLsS --retry 3 -o /tmp/bundletool.jar https://github.com/google/bundletool/releases/download/1.18.2/bundletool-all-1.18.2.jar
          java -jar /tmp/bundletool.jar validate --bundle=build/JumpyFrog-Monetized-QA.aab
          python3 tools/verify_16kb_elf.py build/JumpyFrog-Monetized-QA.aab
          java -jar /tmp/bundletool.jar dump config --bundle=build/JumpyFrog-Monetized-QA.aab | tee /tmp/jumpy-bundle-config.txt
          grep -q "PAGE_ALIGNMENT_16K" /tmp/jumpy-bundle-config.txt || { echo "::error::Bundle does not request 16KiB native zip alignment"; exit 1; }
          java -jar /tmp/bundletool.jar dump manifest --bundle=build/JumpyFrog-Monetized-QA.aab --module=base --xpath=/manifest/uses-sdk/@android:targetSdkVersion | tee /tmp/target.txt
          grep -qx '36' /tmp/target.txt
          test -s addons/GodotGooglePlayBilling/bin/release/GodotGooglePlayBilling-release.aar
          test -s addons/admob/android/bin/ads/libs/poing-godot-admob-ads-release.aar
          sha256sum build/JumpyFrog-Monetized-QA.aab
      - name: Validate separately signed RELEASE mode using disposable QA key
        shell: bash
        run: |
          set -euo pipefail
          # This is NOT the production upload key or the real Play AAB.
          keytool -genkeypair -noprompt \
            -keystore "$RUNNER_TEMP/jumpy-temporary-release-qa.jks" \
            -alias testonly -storepass demo-release-pass -keypass demo-release-pass \
            -dname "CN=Jumpy QA,O=Testing,C=US" -validity 10 -keyalg RSA -keysize 3072
          export GODOT_ANDROID_KEYSTORE_RELEASE_PATH="$RUNNER_TEMP/jumpy-temporary-release-qa.jks"
          export GODOT_ANDROID_KEYSTORE_RELEASE_USER="testonly"
          export GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD="demo-release-pass"
          timeout --kill-after=15s 900s godot --headless --path . --export-release "Google Play AAB" build/JumpyFrog-RELEASE-TEST-ONLY.aab
          test -s build/JumpyFrog-RELEASE-TEST-ONLY.aab
          unzip -tq build/JumpyFrog-RELEASE-TEST-ONLY.aab
          jarsigner -verify -verbose -certs build/JumpyFrog-RELEASE-TEST-ONLY.aab 2>&1 | tee /tmp/jumpy-qa-signature.txt
          grep -q "jar verified" /tmp/jumpy-qa-signature.txt
          python3 tools/verify_16kb_elf.py build/JumpyFrog-RELEASE-TEST-ONLY.aab
          java -jar /tmp/bundletool.jar validate --bundle=build/JumpyFrog-RELEASE-TEST-ONLY.aab
          java -jar /tmp/bundletool.jar dump config --bundle=build/JumpyFrog-RELEASE-TEST-ONLY.aab | grep -q 'PAGE_ALIGNMENT_16K'
          java -jar /tmp/bundletool.jar dump manifest --bundle=build/JumpyFrog-RELEASE-TEST-ONLY.aab --module=base --xpath=/manifest/uses-sdk/@android:targetSdkVersion | grep -qx '36'
          echo "PASS: signed release-mode AAB with disposable CI key, API 36 and 16KiB ELF/zip alignment"
      - name: Export installable monetized TEST APK for real Redmi crash testing
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path=Path("export_presets.cfg")
          original=path.read_text()
          assert "[preset.1]" in original and "[preset.1.options]" in original
          tail=original.split("[preset.1]",1)[1]
          tail=tail.replace('name="Google Play AAB"','name="Monetized TEST APK"',1)
          tail=tail.replace('export_path="build/JumpyFrog-Play.aab"','export_path="build/JumpyFrog-Monetized-TEST.apk"',1)
          tail=tail.replace("[preset.1.options]","[preset.2.options]",1)
          tail=tail.replace("gradle_build/export_format=1","gradle_build/export_format=0",1)
          path.write_text(original+"\n[preset.2]"+tail)
          PY
          timeout --kill-after=15s 900s godot --headless --path . --export-debug "Monetized TEST APK" build/JumpyFrog-Monetized-TEST.apk
          test -s build/JumpyFrog-Monetized-TEST.apk
          unzip -tq build/JumpyFrog-Monetized-TEST.apk
          APKSIGNER="${ANDROID_HOME:-${ANDROID_SDK_ROOT}}/build-tools/36.0.0/apksigner"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs build/JumpyFrog-Monetized-TEST.apk
      - uses: actions/upload-artifact@v4
        with:
          name: JumpyFrog-Monetized-Android-TEST-APK
          path: build/JumpyFrog-Monetized-TEST.apk
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: JumpyFrog-Monetized-TEST-ONLY-AAB
          path: build/JumpyFrog-Monetized-QA.aab
          if-no-files-found: error
          retention-days: 14
